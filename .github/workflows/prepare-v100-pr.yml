name: prepare-v100-pr

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'agent/brkchrd-1.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/brkchrd-1.0
          fetch-depth: 0

      - name: Extract and apply final audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/prepare-v100.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          body = source[start:end]
          Path('/tmp/prepare_v100.py').write_text(
              '\n'.join(line[10:] if line.startswith('          ') else line for line in body) + '\n'
          )
          PY
          python3 /tmp/prepare_v100.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/sdl_main.cpp')
          text = path.read_text()
          old = 'const InputState& in, const std::optional<ChordSpec>& current, const SynthEngine& synth) {'
          new = 'const InputState& in, const std::optional<ChordSpec>& current) {'
          if text.count(old) != 1:
              raise SystemExit('unexpected draw_chord_panel signature')
          text = text.replace(old, new)
          old = 'draw_chord_panel(r, p, ui, in, current, synth);'
          new = 'draw_chord_panel(r, p, ui, in, current);'
          if text.count(old) != 1:
              raise SystemExit('unexpected draw_chord_panel call')
          path.write_text(text.replace(old, new))
          PY
          sed -i 's/[[:space:]]\+$//' README.md
          rm -f audio-audit.csv
          git checkout HEAD -- .github/workflows

      - name: Validate prepared tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(sh tools/project_version.sh)" = 1.0.0
          test -f docs/releases/v1.0.0.md
          test -f include/brkchrd/version.hpp.in
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          build/brkchrd-audio-audit /tmp/audio-audit.csv --strict

      - name: Commit prepared release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name myldy20
          git config user.email myldy20@users.noreply.github.com
          git add -A
          git commit -m 'Prepare BRKCHRD 1.0.0'
          git push origin HEAD:agent/brkchrd-1.0
