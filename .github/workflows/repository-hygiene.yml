name: repository-hygiene

on:
  pull_request_target:
    types:
      - closed
  push:
    branches:
      - main
    paths:
      - .github/workflows/repository-hygiene.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: repository-hygiene
  cancel-in-progress: false

jobs:
  delete-just-merged-branch:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged source branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            exit 0
          fi
          ENCODED=$(jq -rn --arg value "$BRANCH" '$value|@uri')
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$ENCODED" || true

  delete-branches-from-merged-prs:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete closed merged PR branches
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t OPEN_HEADS < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
              --jq '.[] | select(.head.repo.full_name == .base.repo.full_name) | .head.ref' \
              | sort -u
          )
          mapfile -t MERGED_HEADS < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=closed&per_page=100" \
              --jq '.[] | select(.merged_at != null and .head.repo.full_name == .base.repo.full_name) | .head.ref' \
              | sort -u
          )

          for branch in "${MERGED_HEADS[@]}"; do
            [ -n "$branch" ] || continue
            [ "$branch" != "$DEFAULT_BRANCH" ] || continue
            if printf '%s\n' "${OPEN_HEADS[@]}" | grep -Fxq "$branch"; then
              echo "Keeping branch used by an open PR: $branch"
              continue
            fi
            encoded=$(jq -rn --arg value "$branch" '$value|@uri')
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded" >/dev/null 2>&1; then
              echo "Deleted merged branch: $branch"
            else
              echo "Already absent or protected: $branch"
            fi
          done
